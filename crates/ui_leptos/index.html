<!DOCTYPE html>
<html>
<head>
  <title>ui-leptos</title>
  <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/assets/core.css" />
  <link rel="stylesheet" href="/assets/custom.css" />
</head>
<body>
  <link data-trunk rel="copy-dir" href="assets" />
  <link data-trunk rel="rust" />
  <!-- Our own id: `#fluxen` means "mount me with the defaults". Any page that configures the boot calls
       mount(element, options) from its own script instead. -->
  <div id="fluxen" data-codec=""></div>
  <!-- The codec is the PAGE's opinion, not the boot's (ADR-0046): this snippet reads the address and hands
       the answer to the element the boot mounts. A token would be the host's business, and rides the
       socket's query string, not this page. -->
  <script>
    (() => {
      const el = document.getElementById("fluxen");
      const said = new URLSearchParams(location.search).get("codec");
      if (said) el.dataset.codec = said;
    })();
  </script>
</body>
</html>
