# Example: the 3D browser capability module (first implementation of the ADR 0007 module contract).
# Build:
#   cargo build --release --target wasm32-unknown-unknown
#   wasm-bindgen --target web --out-dir pkg \
#     target/wasm32-unknown-unknown/release/browser3d.wasm
# The pkg/ contents (browser3d.js + browser3d_bg.wasm), together with this directory's index.js,
# are copied into examples/renderer/assets/3dbrowser/ (that dir is not in git); the Canvas component's
# url points at index.js.
[workspace]

[package]
name = "browser3d"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
three-d = { version = "0.19", default-features = false }
three-d-asset = { version = "0.10", features = ["gltf", "http", "image"] }
ciborium = "0.2"
glow = "0.17"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "HtmlElement",
    "WebGl2RenderingContext",
    "Document",
    "Element",
    "CssStyleDeclaration",
    "Url",
    "Window",
    "console",
] }

[profile.release]
opt-level = "s"
lto = "fat"
# panic=unwind (wasm's default abort swallows the panic message, leaving only a bare unreachable):
# lets the std panic hook print it to console.error for diagnosis; the wasm boundary still aborts.
panic = "unwind"
