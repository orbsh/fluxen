action: create
slot: ""
data:
  type: frame
  attrs:
    horizontal: true
    class:
    - box
  children:
  - type: frame
    children:
    - type: frame
      attrs:
        class:
        - box
        - border
        - shadow
      children:
      - type: text
        source: {default: child of box}
    - type: text
      source: {slot: test-data, default: 123}
  - type: tiles
    attrs: {}
    source: {slot: chat}
    children:
    - type: frame
      attrs:
        class:
        - box
        - border
        - shadow
  - type: frame
    children:
    - type: text
      source: {slot: test-data, default: lv 1}
    - type: frame
      children:
      - type: text
        source: {default: lv 2}
      - type: frame
        children:
        - type: frame
          children: null
        - type: text
          source: {default: lv 3}
  - type: input
    sink: {slot: message}
  - type: button
    sink: {slot: ok, default: Count}

