# Hierarchy instead of merged cells (ADR 0031 §4): a field whose children are records is a list,
# and the grid draws each of them as a child row under the row it belongs to.
# No colspan/rowspan anywhere - the data already says which row a row hangs from.
# Columns are shared by every row, so a child record names the same fields its parent does.
- action: append
  slot: orders
  data:
    type: tiles
    attrs:
      class: [--orders]
      columns:
      - {key: order/no, title: Order, width: 7rem}
      - {key: item/lines, title: Lines}
      - {key: qty, title: Qty, width: 5rem, align: end}
      - {key: amount, title: Amount, width: 7rem, align: end}
      # Two rows: `order/no` groups under `order`, `item/lines` under `item` - the key is the path.
      header: {selector: --orders-head, rows: 2}
    source: {slot: orders}
# ---- one order per record; its `item/lines` field holds the line records ----
- action: append
  slot: orders
  data:
    type: record
    id: A-1001
    children:
    - type: text
      attrs: {selector: order/no}
      source: {default: A-1001}
    - type: frame
      attrs: {selector: item/lines}
      children:
      - type: record
        id: A-1001-1
        children:
        - type: text
          attrs: {selector: qty}
          source: {default: '2'}
        - type: text
          attrs: {selector: amount}
          source: {default: 4.50}
      - type: record
        id: A-1001-2
        children:
        - type: text
          attrs: {selector: qty}
          source: {default: '1'}
        - type: text
          attrs: {selector: amount}
          source: {default: 33.83}
- action: append
  slot: orders
  data:
    type: record
    id: A-1002
    children:
    - type: text
      attrs: {selector: order/no}
      source: {default: A-1002}
    - type: frame
      attrs: {selector: item/lines}
      children:
      - type: record
        id: A-1002-1
        children:
        - type: text
          attrs: {selector: qty}
          source: {default: '12'}
        - type: text
          attrs: {selector: amount}
          source: {default: 0.31}