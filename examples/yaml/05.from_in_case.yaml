# A goods table (ADR 0031 §4): `tiles` + `fields`, no more table/thead/tbody/tr/th/td.
# Every row of data is an `entry`, with the field name = the child node's `attrs.selector`; fields are projected by key only, never by position.
# Rows are appended into the `goods` slot, so adding or removing a row is a list operation, not a layout change.
- action: append
  slot: chat
  data:
    type: frame
    id: QQucja82kxbHPGLozJWdbk
    children:
    - type: frame
    - type: frame
    - type: bundle
      id: QQucja82kxbHPGLozJWdbk
      attrs:
        submit: [enter, button]
      children:
      - type: text
        attrs:
          class: [ai-center, box, is-border]
      - type: frame
        attrs:
          class: [gap, gap-md]
        children:
        - type: tiles
          attrs:
            fields:
            - {key: qty, title: '', width: 4rem}
            - {key: image, title: '', width: 3rem}
            - {key: name, title: Name}
            - {key: price, title: Price, width: 6rem, align: end}
            - {key: description, title: Description}
            header: {selector: --goods-head}
          source: {slot: goods}
      - type: button
        attrs:
          oneshot: true
        sink: {}
# ---- three goods rows: the id is the row's key (the same set of keys is used by stage/step/remove) ----
- action: append
  slot: goods
  data:
    type: entry
    id: '853736'
    children:
    - type: input
      attrs: {selector: qty}
      source: {default: 1, type: number}
      sink: {slot: '853736', scope: local}
    - type: image
      attrs: {selector: image, desc: '853736', height: 2em}
      source:
        default: https://i.xinminghui.com/goods/202302/source_img/202302270408590.JPG
    - type: text
      attrs: {selector: name}
      source: {default: Honeywell 901 Mask Headband Color Box}
    - type: text
      attrs: {selector: price}
      source: {default: 2.25}
    - type: text
      attrs: {selector: description}
      source: {default: 'Efficient filtration, headband design, comfortable to wear'}
