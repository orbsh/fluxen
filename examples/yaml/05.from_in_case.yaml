# 一张商品表（ADR 0031 §4）：`tiles` + `fields`，不再有 table/thead/tbody/tr/th/td。
# 每一条数据是一条 `entry`，字段名 = 子节点的 `attrs.selector`；字段只按 key 投影，不认位置。
# 行是 append 进 `goods` 槽的，所以增删一行是列表操作，不是改布局。
- action: append
  slot: chat
  data:
    type: frame
    id: QQucja82kxbHPGLozJWdbk
    children:
    - type: frame
    - type: frame
    - type: bundle
      id: QQucja82kxbHPGLozJWdbk
      attrs:
        submit: [enter, button]
      children:
      - type: text
        attrs:
          class: [ai-center, box, is-border]
      - type: frame
        attrs:
          class: [gap, gap-md]
        children:
        - type: tiles
          attrs:
            fields:
            - {key: qty, title: '', width: 4rem}
            - {key: image, title: '', width: 3rem}
            - {key: name, title: Name}
            - {key: price, title: Price, width: 6rem, align: end}
            - {key: description, title: Description}
            header: {selector: --goods-head}
          source: {slot: goods}
      - type: button
        attrs:
          oneshot: true
        sink: {}
# ---- 三行商品：id 就是行的键（同一套键给 stage/step/remove 用） ----
- action: append
  slot: goods
  data:
    type: entry
    id: '853736'
    children:
    - type: input
      attrs: {selector: qty}
      source: {default: 1, type: number}
      sink: {slot: '853736', scope: local}
    - type: image
      attrs: {selector: image, desc: '853736', height: 2em}
      source:
        default: https://i.xinminghui.com/goods/202302/source_img/202302270408590.JPG
    - type: text
      attrs: {selector: name}
      source: {default: Honeywell 901 Mask Headband Color Box}
    - type: text
      attrs: {selector: price}
      source: {default: 2.25}
    - type: text
      attrs: {selector: description}
      source: {default: 'Efficient filtration, headband design, comfortable to wear'}
