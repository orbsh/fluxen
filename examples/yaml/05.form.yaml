action: append
slot: chat
data:
  type: loom
  sink: {dest: confirm}
  attrs:
    submit: [enter, button]
    # Two sends and no more (ADR 0032 §5): each one takes a count off, and at zero the fields are
    # disabled and the button stops sending. Absent (or -1) is unlimited, which is the usual case.
    sends: 2
    class:
    - gap
    - gap-md
  children:
  - type: text
    attrs:
      class:
      - ai-center
    source: {default: confirm order}
  - type: text
    source: {default: test}
  - type: frame
    attrs:
      class:
      - gap
      - gap-md
    children:
    - type: frame
      attrs:
        horizontal: true
      children:
      - type: input
        tag: name
        source: {default: name}
      - type: input
        tag: age
        source: {default: age}
    - type: frame
      attrs:
        horizontal: true
      children:
      - type: input
        tag: gender
      - type: input
        tag: phone
    - type: frame
      attrs:
        horizontal: true
      children:
      - type: input
        tag: var
  - type: button
    attrs:
      oneshot: false
    source: {default: confirm}

