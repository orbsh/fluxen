action: append
slot: chat
data:
  type: form
  sink: {slot: confirm}
  attrs:
    class:
    - gap
    - md
  children:
  - type: text
    attrs:
      class:
      - ai-center
    source: {default: confirm order}
  - type: text
    sink: {slot: test}
  - type: frame
    attrs:
      class:
      - gap
      - md
    children:
    - type: frame
      attrs:
        horizontal: true
      children:
      - type: input
        sink: {slot: name, scope: local, default: name}
      - type: input
        sink: {slot: age, scope: local, default: age}
    - type: frame
      attrs:
        horizontal: true
      children:
      - type: input
        name: gender
        sink: {slot: gender, scope: local}
      - type: input
        name: phone
        sink: {slot: phone, scope: local}
    - type: frame
      attrs:
        horizontal: true
      children:
      - type: input
        name: var
  - type: button
    attrs:
      oneshot: false
    sink: {}
    source: {default: confirm}

