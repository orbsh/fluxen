action: append
slot: chat
data:
  type: bundle
  sink: {slot: confirm}
  attrs:
    submit: [enter, button]
    class:
    - gap
    - md
  children:
  - type: text
    attrs:
      class:
      - ai-center
    source: {default: confirm order}
  - type: text
    source: {default: test}
  - type: frame
    attrs:
      class:
      - gap
      - md
    children:
    - type: frame
      attrs:
        horizontal: true
      children:
      - type: input
        tag: name
        source: {default: name}
      - type: input
        tag: age
        source: {default: age}
    - type: frame
      attrs:
        horizontal: true
      children:
      - type: input
        tag: gender
      - type: input
        tag: phone
    - type: frame
      attrs:
        horizontal: true
      children:
      - type: input
        tag: var
  - type: button
    attrs:
      oneshot: false
    sink: {}
    source: {default: confirm}

