# 标签页联动（ADR 0010 诚实形态；ADR 0031 §4 起是 tiles）：两份互异的数据——
# 菜单项（tab 栏，短标签行）与页面内容（tiles 的行），内容不等于被点的 id。
# select 点击 emit 包装对象 {slot, id?, data}（与上行同形）落 local 槽
# `page`；标题与 tiles 订阅同槽、各按 data 取件——同事件两处消费。
# 页面行就在 tiles 的槽里（行 id = 键）：`window: {size: 1}` 是页，`step: {slot: page}`
# 是导航写的那根轴——不引入任何寻址语法。
# 纯前端往返为零：菜单与页面都由服务端喂（list 平面），此后每次点击
# 不经过 transport。横排 tab 栏 = select 自身 attrs.horizontal: true。
- action: create
  slot: ""
  data:
    type: frame
    attrs:
      class:
      - maximize
    children:
    - type: frame
      attrs:
        class:
        - --tabs
        - nogrow
        - shadow
        horizontal: true
      children:
      - type: select
        attrs:
          horizontal: true
        source: {slot: page, scope: local}
        sink: {slot: page, scope: local}
        options: {slot: tabs}
    - type: text
      attrs:
        class:
        - --page-title
        format: md
      source:
        slot: page
        scope: local
        path: /data
        default: "**（未打开任何页）**"
    - type: tiles
      id: pager
      attrs:
        class:
        - --content
        - shrink
        window: {size: 1}
      source: {slot: pages}
      step: {slot: page}
# ---- 菜单行：短标签 + id（tab 栏的选项） ----
- action: append
  slot: tabs
  data:
    type: text
    id: home
    source: {default: 首页}
- action: append
  slot: tabs
  data:
    type: text
    id: docs
    source: {default: 文档}
- action: append
  slot: tabs
  data:
    type: text
    id: about
    source: {default: 关于}
# ---- 页面行：id 与菜单同键、内容互异（tiles 的行） ----
- action: append
  slot: pages
  data:
    type: text
    id: home
    attrs:
      format: md
    source:
      default: "# 首页\n欢迎。切 tab 不换页则本页常驻（每一行都挂着，只切换台上的是哪一块）。"
- action: append
  slot: pages
  data:
    type: frame
    id: docs
    children:
    - type: text
      attrs:
        format: md
      source:
        default: "## 文档页（表单）"
    - type: bundle
      attrs:
        submit: [enter, button]
      children:
      - type: input
        tag: doc_draft
        source: {default: 草稿切页后还在（每一行都挂着）}
      - type: button
        attrs:
          oneshot: false
        sink: {}
        source: {default: 保存}
- action: append
  slot: pages
  data:
    type: input
    id: about
    multiline: true
    source:
      default: "关于页：改这里的内容后切走再切回——每一行都挂着，输入保。"
