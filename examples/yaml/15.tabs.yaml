# 标签页联动（ADR 0010 诚实形态）：两份互异的数据——菜单项（tab 栏，
# 短标签行）与页面内容（Pages 的字典行），内容不等于被点的 id。
# select 点击 emit 包装对象 {slot, id?, data}（与上行同形）落 local 槽
# `page`；标题与 Pages 订阅同槽、各按 /data 取件——同事件两处消费。
# 页面字典在 Pages 私有状态里（行 id = 键），不引入任何寻址语法。
# 纯前端往返为零：菜单与页面都由服务端喂（list 平面），此后每次点击
# 不经过 transport。横排 tab 栏 = select 自身 attrs.horizontal: true。
- action: create
  slot: ""
  data:
    type: frame
    attrs:
      class:
      - maximize
    children:
    - type: frame
      attrs:
        class:
        - --tabs
        - nogrow
        - shadow
        horizontal: true
      children:
      - type: select
        attrs:
          horizontal: true
        source: {slot: page, scope: local}
        sink: {slot: page, scope: local}
        options: {slot: tabs}
    - type: text
      attrs:
        class:
        - --page-title
        format: md
      source:
        slot: page
        scope: local
        path: /data
        default: "**（未打开任何页）**"
    - type: pages
      id: pager
      attrs:
        class:
        - --content
        - shrink
      source: {slot: pages}
      select: {slot: page, scope: local, path: /data}
# ---- 菜单行：短标签 + id（tab 栏的选项） ----
- action: append
  slot: tabs
  data:
    type: text
    id: home
    source: {default: 首页}
- action: append
  slot: tabs
  data:
    type: text
    id: docs
    source: {default: 文档}
- action: append
  slot: tabs
  data:
    type: text
    id: about
    source: {default: 关于}
# ---- 页面行：id 与菜单同键、内容互异（Pages 的字典） ----
- action: append
  slot: pages
  data:
    type: text
    id: home
    attrs:
      format: md
    source:
      default: "# 首页\n欢迎。切 tab 不换页则本页常驻（display 模式为 render）。"
- action: append
  slot: pages
  data:
    type: frame
    id: docs
    children:
    - type: text
      attrs:
        format: md
      source:
        default: "## 文档页（表单）"
    - type: form
      children:
      - type: input
        sink: {slot: doc_draft, scope: local, default: 草稿写在切页后丢失（render 语义）}
      - type: button
        attrs:
          oneshot: false
        sink: {}
        source: {default: 保存}
- action: append
  slot: pages
  data:
    type: textarea
    id: about
    source:
      default: "关于页：改这里的内容后切走再切回——render 模式会丢，dom 模式保。"
