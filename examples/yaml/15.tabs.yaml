# Tab linkage (ADR 0010's honest shape; tiles since ADR 0031 §4): two distinct datasets —
# menu items (the tab bar, short label rows) and page content (rows of tiles); the content is not the id that was clicked.
# Clicking select emits the wrapper object {slot, id?, data} (same shape as uplink) into the local slot
# `page`; the title and the tiles subscribe to the same slot and each take their piece by data — one event consumed in two places.
# The page rows live right in the tiles slot (row id = key): `window: {size: 1}` is the page, `step: {slot: page}`
# is the axis the navigation writes — no addressing syntax is introduced.
# Purely frontend, zero round trips: menu and pages alike are fed by the server (list plane), and from then on every click
# does not go through transport. The horizontal tab bar = select's own attrs.horizontal: true.
- action: create
  slot: ""
  data:
    type: frame
    attrs:
      class:
      - maximize
    children:
    - type: frame
      attrs:
        class:
        - --tabs
        - nogrow
        - is-shadow
        horizontal: true
      children:
      - type: select
        attrs:
          horizontal: true
        source: {slot: page, scope: local}
        sink: {slot: page, scope: local}
        options: {slot: tabs}
    - type: text
      attrs:
        class:
        - --page-title
        format: md
      source:
        slot: page
        scope: local
        path: /data
        default: "**（未打开任何页）**"
    - type: tiles
      id: pager
      attrs:
        class:
        - --content
        - shrink
        window: {size: 1}
      source: {slot: pages}
      step: {slot: page}
# ---- menu rows: short label + id (the options of the tab bar) ----
- action: append
  slot: tabs
  data:
    type: text
    id: home
    source: {default: 首页}
- action: append
  slot: tabs
  data:
    type: text
    id: docs
    source: {default: 文档}
- action: append
  slot: tabs
  data:
    type: text
    id: about
    source: {default: 关于}
# ---- page rows: same keys as the menu ids, distinct content (rows of tiles) ----
- action: append
  slot: pages
  data:
    type: text
    id: home
    attrs:
      format: md
    source:
      default: "# 首页\n欢迎。切 tab 不换页则本页常驻（每一行都挂着，只切换台上的是哪一块）。"
- action: append
  slot: pages
  data:
    type: frame
    id: docs
    children:
    - type: text
      attrs:
        format: md
      source:
        default: "## 文档页（表单）"
    - type: bundle
      attrs:
        submit: [enter, button]
      children:
      - type: input
        tag: doc_draft
        source: {default: 草稿切页后还在（每一行都挂着）}
      - type: button
        attrs:
          oneshot: false
        sink: {}
        source: {default: 保存}
- action: append
  slot: pages
  data:
    type: input
    id: about
    multiline: true
    source:
      default: "关于页：改这里的内容后切走再切回——每一行都挂着，输入保。"
