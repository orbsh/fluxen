# Initial layout: graph on the left, stream on the right (the main UI shape after ADR 0018).
#
# The screen has a fixed two columns, no menu, no tabs, no routing:
#   left column  a persistent 3D force-directed graph (the native `forcegraph` component), for structure, relations and state;
#   right column  a single message stream (tiles + the chat data slot), for reading, input and actions.
# When width runs short, shrink the left graph first (see .stage-graph / .stage-stream in custom.css).
#
# Difference from the older layout: "chat" used to be one page among pages, with a channel select on the
# left, and a channel list is addressed by category — a judgement made once and never revised. The graph is
# addressed by relation, so the navigation elements come from the graph; tabs / pages / channel are gone.
#
# Further frames keep feeding the graph data (whole snapshots, diffed by id): this file only lays down the
# crate layer, so the left column has something to show on the very first screen.
- action: create
  slot: ""
  data:
    type: frame
    attrs:
      class:
      - maximize
      - stage-split
      horizontal: true
    children:
    # ---- left column: persistent relation graph ------------------------------
    - type: frame
      attrs:
        class:
        - stage-graph
      children:
      - type: forcegraph
        attrs:
          width: 100%
          height: 100%
        style:
          fit_padding_px: 56
        source: {slot: graph}
      # ---- the corner switch (ADR 0030, `place: anchor`) ----------------------
      # The graph's own buttons live inside the component, at the top edge; this one is a page node that
      # floats over the bottom-right corner — empty in the component's own layout. `place: anchor` means children[0] is the trigger and children[1] the card; Esc
      # and a click outside close it. The checkbox owns `sketch` from the page's side (ADR 0038 §2).
      - type: panel
        attrs:
          class:
          - stage-corner
          place: anchor
        children:
        - type: text
          attrs:
            class:
            - box
            - is-border
            - round
            - pad-sm
            - text-sm
            - is-pointer
            - is-highlight
          source: {default: wireframe}
        - type: frame
          attrs:
            class:
            - box
            - is-border
            - round
            - is-shadow
            - pad-sm
            - gap
            - text-sm
            horizontal: true
          children:
          - type: text
            attrs:
              class:
              - nogrow
            source: {default: drawn borders}
          - type: bundle
            attrs:
              class:
              - nogrow
              submit: [change]
            sink: {dest: __CONFIG__, scope: local, path: /}
            children:
            - type: input
              tag: sketch
              kind: bool
              source: {slot: __CONFIG__, path: /sketch, scope: both}
    # ---- right column: message stream ---------------------------------------
    - type: frame
      attrs:
        class:
        - stage-stream
        - main
        - shrink
      children:
      - type: tiles
        attrs:
          class:
          - --message
          - box
          - ac-start
          - gap
          - scrolly
        source: {slot: chat}
        children:
        - type: frame
          attrs:
            class:
            - nogrow
            - as-end
            - accent
            - box
            - is-border
            - round
            - is-shadow
          selector: ask
        - type: frame
          attrs:
            class:
            - nogrow
            - as-stretch
            - box
            - is-border
            - round
            - is-shadow
      - type: frame
        attrs:
          class:
          - --input
          - nogrow
          - box
          horizontal: true
        children:
        - type: frame
          attrs:
            horizontal: true
          children:
          # One field, one bundle (ADR 0032): the bundle owns the exit, the timing and what the field
          # becomes afterwards — `reset: clear` is why the box is empty again after Enter. A field has no
          # uplink of its own any more, so the box without this wrapper would send nothing.
          - type: bundle
            id: test
            sink: {dest: message}
            attrs:
              submit: [enter]
              reset: clear
            children:
            - type: input
              tag: message
    # ---- right rail: the drop target for drags (ADR 0034) -------------------
    # Drag a unit from a bubble over here and it becomes a pin. The drop target hugs the right edge of the window, a thin strip normally,
    # expanding while a drag is in flight; `--rail` makes it grow leftwards, otherwise it grows off-screen (custom.css).
    # `accept: {tag: snippet}` is the pairing: it takes only cargo tagged snippet.
    - type: frame
      id: rail
      attrs:
        class:
        - --rail
        accept: {tag: snippet}
      sink: {dest: pin}

# ---- initial graph snapshot: crate layer ------------------------------------
- action: set
  slot: graph
  data:
    type: frame
    source:
      default:
        focus: null
        nodes:
          - {id: accrete, name: accrete, kind: crate, weight: 9}
          - {id: ui_leptos, name: ui_leptos, kind: crate, weight: 8}
          - {id: content, name: content, kind: crate, weight: 7}
          - {id: transport, name: transport, kind: crate, weight: 5}
          - {id: stage, name: stage, kind: crate, weight: 6}
        links:
          - {source: ui_leptos, target: accrete, kind: renders, strength: 5}
          - {source: stage, target: content, kind: encodes, strength: 4}
          - {source: stage, target: ui_leptos, kind: serves, strength: 3}
          - {source: transport, target: content, kind: carries, strength: 3}