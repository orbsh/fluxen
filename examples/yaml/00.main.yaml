# 初始 main 布局（完整帧：create 骨架 + home/about 数据行）。单独发送即可起
# 全套。tab 栏用 box 包裹出内边距；pages
# 字典 display=dom：切走再切回，页面内滚动/输入状态保持。
# 菜单行（tabs 槽）与页面行（pages 槽）内容互异；点击 select emit 包装
# 对象 {event, id?, data} 落 local 槽 `page`，pages 的 select 订阅按
# /data 取键（ADR 0010；不设标题节点——键不是展示内容）。
# chat 页不在初始菜单——后续用 00.chat.yaml 动态加入。
# home 主体绑定事件 home::open：页面内输入框回车即上行（stage console
# 可见），与 tab 的 local 联动相对照——事件走 transport，联动不走。
- action: create
  event: ""
  data:
    type: case
    attrs:
      class:
      - maximize
    children:
    - type: case
      attrs:
        class:
        - --tabs
        - nogrow
        - shadow
        horizontal: true
      children:
      - type: select
        attrs:
          horizontal: true
        bind:
          value:
            kind: local
            slot: page
          options:
            kind: source
            source: tabs
    - type: pages
      id: pager
      attrs:
        class:
        - --content
        - shrink
      display: dom
      bind:
        value:
          kind: source
          source: pages
        select:
          kind: local
          slot: page
          path: /data
# ---- 菜单行：id 与页面行同键；box 逐 tab 项加内边距（不是整条 tab 栏） ----
- action: append
  event: tabs
  data:
    type: text
    id: home
    attrs:
      class:
      - box
    bind:
      value:
        kind: default
        default: 首页
- action: append
  event: tabs
  data:
    type: text
    id: about
    attrs:
      class:
      - box
    bind:
      value:
        kind: default
        default: 关于
# ---- 页面行 ----
- action: append
  event: pages
  data:
    type: case
    id: home
    children:
    - type: text
      attrs:
        format: md
      bind:
        value:
          kind: default
          default: "# 首页\n主体绑定事件 `home::open`：在下面输入框回车即上行（见 stage console）。"
    - type: input
      bind:
        value:
          kind: event
          event: home::open
- action: append
  event: pages
  data:
    type: textarea
    id: about
    bind:
      value:
        kind: default
        default: "关于页：dom 模式下切走再切回，这里的草稿不丢。"
