# Initial layout: graph on the left, stream on the right (the main UI shape after ADR 0018).
#
# The screen has a fixed two columns, no menu, no tabs, no routing:
#   left column  a persistent 3D force-directed graph (the native `forcegraph` component), for structure, relations and state;
#   right column  a single message stream (rack + the chat data slot), for reading, input and actions.
# When width runs short, shrink the left graph first (see .stage-graph / .stage-stream in custom.css).
#
# Difference from the old layout: previously "chat" was one page among pages, with a channel select on the left —
# the channel list was addressed by category, and a category is a one-off judgement made once and never revised. The graph is addressed by relation, so
# the navigation elements come from the graph on the left; tabs / pages / channel are all gone.
#
# Further frames keep feeding the graph data (whole snapshots, diffed by id): this file only lays down the crate layer,
# so the left column has something to show on the very first screen.
- action: create
  slot: ""
  data:
    type: frame
    attrs:
      class:
      - maximize
      - stage-split
      horizontal: true
    children:
    # ---- left column: persistent relation graph ------------------------------
    - type: frame
      attrs:
        class:
        - stage-graph
      children:
      - type: forcegraph
        attrs:
          width: 100%
          height: 100%
        style:
          fit_padding_px: 56
        source: {slot: graph}
    # ---- right column: message stream ---------------------------------------
    - type: frame
      attrs:
        class:
        - stage-stream
        - main
        - shrink
      children:
      - type: tiles
        attrs:
          class:
          - --message
          - box
          - ac-start
          - gap
          - scrolly
        source: {slot: chat}
        children:
        - type: frame
          attrs:
            class:
            - nogrow
            - as-end
            - accent
            - box
            - is-border
            - round
            - is-shadow
            selector: ask
        - type: frame
          attrs:
            class:
            - nogrow
            - as-stretch
            - box
            - is-border
            - round
            - is-shadow
      - type: frame
        attrs:
          class:
          - --input
          - nogrow
          - box
          horizontal: true
        children:
        - type: frame
          attrs:
            horizontal: true
          children:
          - type: input
            id: test
            sink: {slot: message}
    # ---- right rail: the drop target for drags (ADR 0034) -------------------
    # Drag a unit from a bubble over here and it becomes a pin. The drop target hugs the right edge of the window, a thin strip normally,
    # expanding while a drag is in flight; `--rail` makes it grow leftwards, otherwise it grows off-screen (custom.css).
    # `accept: {tag: snippet}` is the pairing: it takes only cargo tagged snippet.
    - type: frame
      id: rail
      attrs:
        class:
        - --rail
        accept: {tag: snippet}
      sink: {slot: pin}

# ---- initial graph snapshot: crate layer ------------------------------------
- action: set
  slot: graph
  data:
    type: frame
    source:
      default:
        focus: null
        nodes:
          - {id: accrete, name: accrete, kind: crate, weight: 9}
          - {id: ui_leptos, name: ui_leptos, kind: crate, weight: 8}
          - {id: content, name: content, kind: crate, weight: 7}
          - {id: transport, name: transport, kind: crate, weight: 5}
          - {id: stage, name: stage, kind: crate, weight: 6}
        links:
          - {source: ui_leptos, target: accrete, kind: renders, strength: 5}
          - {source: stage, target: content, kind: encodes, strength: 4}
          - {source: stage, target: ui_leptos, kind: serves, strength: 3}
          - {source: transport, target: content, kind: carries, strength: 3}
