# 以 15.tabs 的 Pages 结构为基础 main 布局：tab 栏 + 标题 + pages 字典；
# 00.chat_layout 的整棵聊天树不再是 create 布局，而是作为一行（id: chat）
# append 进 pages 字典——成为其中一个页面。display: dom：聊天页常驻 DOM，
# 切走再切回滚动位置与输入草稿存活（这正是 dom 语义的真实用例）。
- action: create
  event: ""
  data:
    type: case
    attrs:
      class:
      - maximize
    children:
    - type: case
      attrs:
        class:
        - --tabs
        - nogrow
        - shadow
        horizontal: true
      children:
      - type: select
        attrs:
          horizontal: true
        bind:
          value:
            kind: local
            slot: page
          options:
            kind: source
            source: tabs
    - type: text
      attrs:
        class:
        - --page-title
        format: md
      bind:
        value:
          kind: local
          slot: page
          path: /data
          default: "**（未打开任何页）**"
    - type: pages
      id: pager
      attrs:
        class:
        - --content
        - shrink
      display: dom
      bind:
        value:
          kind: source
          source: pages
        select:
          kind: local
          slot: page
          path: /data
# ---- 菜单行：id 与页面行同键 ----
- action: append
  event: tabs
  data:
    type: text
    id: chat
    bind:
      value:
        kind: default
        default: 聊天
- action: append
  event: tabs
  data:
    type: text
    id: about
    bind:
      value:
        kind: default
        default: 关于
# ---- 页面行 ----
- action: append
  event: pages
  data:
    type: textarea
    id: about
    bind:
      value:
        kind: default
        default: "关于页：dom 模式下切走再切回，这里的草稿不丢。"
- action: append
  event: pages
  data:
    type: case
    id: chat
    attrs:
      class:
      - shrink
    children:
    - type: text
      bind:
        value:
          kind: source
          default: "**chat**"
          source: login
      attrs:
        class:
        - --header
        - nogrow
        format: md
    - type: case
      attrs:
        horizontal: true
        class:
        - --body
        - shrink
        - border
        - round
      children:
      - type: case
        attrs:
          class:
          - --leftside
          - nogrow
        children:
        - type: text
          attrs:
            format: md
            class:
            - box
          bind:
            value:
              kind: default
              default: "**channel**"
        - type: select
          attrs:
            class:
            - --channel
            - ji-center
            - nogrow
          bind:
            value:
              kind: event
              event: channel::select
              default: "2"
            options:
              kind: source
              source: channel::list
      - type: case
        attrs:
          class:
          - main
          - shrink
        children:
        - type: case
          children:
          - type: rack
            attrs:
              class:
              - --message
              - box
              - ac-start
              - gap
              - scrolly
              scroll: true
            bind:
              value:
                kind: source
                source: chat
            item:
            - type: case
              attrs:
                class:
                - nogrow
                - as-end
                - accent
                - box
                - border
                - round
                - shadow
                selector: ask
            - type: case
              attrs:
                class:
                - nogrow
                - as-stretch
                - box
                - border
                - round
                - shadow
          - type: float
            attrs:
              bottom: 0.2rem
              left: 1rem
            children:
            - type: popup
              attrs:
                class:
                - --cart
                - box
                - border
                - shadow
                - primary
                direction: U
              bind:
                value:
                  kind: source
                  source: cart
              children:
              - type: template
                name: cart
                data: {}
              - type: case
                children:
                - type: text
                  bind:
                    value:
                      kind: default
                      default: a
                - type: text
                  bind:
                    value:
                      kind: default
                      default: b
                - type: text
                  bind:
                    value:
                      kind: default
                      default: c
        - type: case
          attrs:
            class:
            - --input
            - nogrow
            - box
            horizontal: true
          children:
          - type: case
            attrs:
              horizontal: true
            children:
            - type: input
              bind:
                value:
                  kind: event
                  event: message
