# 初始布局：左图右流（ADR 0018 之后的主界面形态）。
#
# 屏幕固定两栏，没有菜单、没有 Tab、没有路由：
#   左栏  常驻三维力导向图（`forcegraph` 原生组件），管结构、关联和状态；
#   右栏  一条消息流（rack + chat 数据槽），管阅读、输入和操作。
# 宽度不够时先收缩左图（见 custom.css 的 .stage-graph / .stage-stream）。
#
# 与旧版布局的差别：原先把「聊天」当成 pages 里的一页、左边挂频道 select ——
# 频道列表按分类寻址，而分类是写完就不改的一次性判断。图按关系寻址，所以
# 导航要素从左边的图来，不再有 tabs / pages / channel 这三样。
#
# 图的数据由后续帧继续喂（整份快照，按 id 求差量）：本文件只铺 crate 层，
# 让左栏第一屏就有东西可看。
- action: create
  event: ""
  data:
    type: case
    attrs:
      class:
      - maximize
      - stage-split
      horizontal: true
    children:
    # ---- 左栏：常驻关系图 ----------------------------------------------------
    - type: case
      attrs:
        class:
        - stage-graph
      children:
      - type: forcegraph
        attrs:
          width: 100%
          height: 100%
        style:
          fit_padding_px: 56
        bind:
          value:
            kind: source
            source: graph
    # ---- 右栏：消息流 --------------------------------------------------------
    - type: case
      attrs:
        class:
        - stage-stream
        - main
        - shrink
      children:
      - type: rack
        attrs:
          class:
          - --message
          - box
          - ac-start
          - gap
          - scrolly
          scroll: true
        bind:
          value:
            kind: source
            source: chat
        item:
        - type: case
          attrs:
            class:
            - nogrow
            - as-end
            - accent
            - box
            - border
            - round
            - shadow
            selector: ask
        - type: case
          attrs:
            class:
            - nogrow
            - as-stretch
            - box
            - border
            - round
            - shadow
      - type: case
        attrs:
          class:
          - --input
          - nogrow
          - box
          horizontal: true
        children:
        - type: case
          attrs:
            horizontal: true
          children:
          - type: input
            id: test
            bind:
              value:
                kind: event
                event: message

# ---- 图的初始快照：crate 层 --------------------------------------------------
- action: set
  event: graph
  data:
    type: group
    bind:
      value:
        kind: default
        default:
          focus: null
          nodes:
            - {id: accrete, name: accrete, kind: crate, weight: 9}
            - {id: ui_leptos, name: ui_leptos, kind: crate, weight: 8}
            - {id: content, name: content, kind: crate, weight: 7}
            - {id: transport, name: transport, kind: crate, weight: 5}
            - {id: stage, name: stage, kind: crate, weight: 6}
          links:
            - {source: ui_leptos, target: accrete, kind: renders, strength: 5}
            - {source: stage, target: content, kind: encodes, strength: 4}
            - {source: stage, target: ui_leptos, kind: serves, strength: 3}
            - {source: transport, target: content, kind: carries, strength: 3}