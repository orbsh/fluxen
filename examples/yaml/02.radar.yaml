# G2 折线趋势 + 部门雷达（ADR 0009，纯 GoG spec 直装 bind.value.default）。
# 日记评分模拟数据：6 维度（出勤纪律/工作质量/工作量投入/协作沟通/学习成长/
# 创新性，0–5 分），11 人 × 3 部门。
# 一个 append 帧：外层 case 用 grid 把容器分成上下两部分（grid-template-rows
#   minmax(0,1fr) ×2 + 固定 height——1fr 默认 minmax(auto,1fr)，auto 最小值会让
#   画布内容撑高自己的行、两行不等分，须 minmax(0,..) 钉死；chart 无 height
#   字段、尺寸全靠 autoFit 读容器，故必须给容器确定高度，否则子图塌成 0）。
#   上：近 30 天部门平均分变化，三个部门同一坐标系（color = dept），
#       shape: smooth 平滑曲线，数据为随机游走造的模拟值。
#   下：单个 chart 节点内 facetRect 按 dept 分面——三个部门水平排列在同一张
#       图里、各自独立雷达坐标系（encode.facet = dept），部门内一人一条线
#       （color = name，line+area+point 三个 child mark），折点 join/cap: round。
# 用法：先 send 00.chat_layout.yaml，再 send 本文件（一帧 append 进 chat rack）。
- action: append
  event: chat
  data:
    type: case
    id: radar-combo
    attrs:
      class: [gap]
      grid:
        grid-template-rows: "minmax(0, 1fr) minmax(0, 1fr)"
        height: "70vh"
    children:
    - type: chart
      id: dept-trend
      attrs:
        class: [f]
