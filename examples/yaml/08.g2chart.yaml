# G2 饼图（ADR 0009）：spec = GoG 词汇的纯 JSON，直装 bind.value.default；
# url 省略 = 默认 /assets/g2chart/index.js（封装模块，eval 注入已退役）。
action: append
event: chat
data:
  type: chart
  bind:
    value:
      kind: default
      default:
        type: interval
        data:
        - {g: Apple, y: 44}
        - {g: Mango, y: 55}
        - {g: Orange, y: 13}
        - {g: Watermelon, y: 33}
        coordinate:
          type: theta
        encode:
          y: y
          color: g
        interaction:
          tooltip: {}
