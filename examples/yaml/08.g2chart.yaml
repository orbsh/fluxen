# G2 饼图（ADR 0009）：spec = GoG 词汇的纯 JSON，直装 bind.value.default；
# url 指向封装模块（ADR 0007 契约；框架不再有 chart 这个种类）。
action: append
slot: chat
data:
  type: canvas
  url: /assets/g2chart/index.js
  bind:
    value:
      kind: default
      default:
        type: interval
        data:
        - {g: Apple, y: 44}
        - {g: Mango, y: 55}
        - {g: Orange, y: 13}
        - {g: Watermelon, y: 33}
        coordinate:
          type: theta
        encode:
          y: y
          color: g
        interaction:
          tooltip: {}
