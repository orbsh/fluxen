# G2 pie chart (ADR 0009): the spec = pure JSON in the GoG vocabulary, installed straight into `source.default`;
# the url points at the wrapper module (ADR 0007 contract; the framework no longer has a chart kind).
action: append
slot: chat
data:
  type: canvas
  url: /assets/g2chart/index.js
  source:
    default:
      type: interval
      data:
      - {g: Apple, y: 44}
      - {g: Mango, y: 55}
      - {g: Orange, y: 13}
      - {g: Watermelon, y: 33}
      coordinate:
        type: theta
      encode:
        y: y
        color: g
      interaction:
        tooltip: {}
