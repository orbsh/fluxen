action: create
slot: ""
data:
  attrs:
    class:
    - maximize
  type: frame
  children:
  - type: frame
    attrs:
      horizontal: true
      class:
      - nogrow
    children:
    - type: text
      source: {slot: login, default: chat with **AI**}
      attrs:
        class:
        - shadow
        - nogrow
        format: md
    - type: form
      sink: {slot: login}
      children:
      - type: button
        source: {default: LOGIN}
        submit: true
  - type: rack
    attrs:
      class:
      - box
      - ac-start
      - gap
      - scrolly
      scroll: true
    source: {slot: chat}
    item:
    - type: frame
      attrs:
        class:
        - box
        - border
        - shadow
        - nogrow
        - as-end
        - accent
        selector: ask
    - type: frame
      attrs:
        class:
        - box
        - border
        - shadow
        - nogrow
        - as-start
  - type: frame
    attrs:
      class:
      - nogrow
      - box
      horizontal: true
    children:
    - type: frame
      attrs:
        horizontal: true
      children:
      - type: input
        sink: {slot: history}
      - type: input
        sink: {slot: echo}

