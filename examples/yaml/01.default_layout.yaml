action: create
slot: ""
data:
  attrs:
    class:
    - maximize
  type: frame
  children:
  - type: frame
    attrs:
      horizontal: true
      class:
      - nogrow
    children:
    - type: text
      source: {slot: login, default: chat with **AI**}
      attrs:
        class:
        - is-shadow
        - nogrow
        format: md
    - type: bundle
      sink: {dest: login}
      attrs:
        submit: [enter, button]
      children:
      - type: button
        source: {default: LOGIN}
        sink: {}
  - type: tiles
    attrs:
      class:
      - box
      - ac-start
      - gap
      - scrolly
    source: {slot: chat}
    children:
    - type: frame
      attrs:
        class:
        - box
        - is-border
        - is-shadow
        - nogrow
        - as-end
        - accent
        selector: ask
    - type: frame
      attrs:
        class:
        - box
        - is-border
        - is-shadow
        - nogrow
        - as-start
  - type: frame
    attrs:
      class:
      - nogrow
      - box
      horizontal: true
    children:
    - type: frame
      attrs:
        horizontal: true
      children:
      - type: bundle
        sink: {dest: history}
        attrs: {submit: [enter]}
        children:
        - type: input
          tag: history
      - type: bundle
        sink: {dest: echo}
        attrs: {submit: [enter]}
        children:
        - type: input
          tag: echo

