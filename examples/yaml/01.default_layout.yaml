action: create
event: ""
data:
  attrs:
    class:
    - maximize
  type: case
  children:
  - type: case
    attrs:
      horizontal: true
      class:
      - nogrow
    children:
    - type: text
      bind:
        value:
          kind: source
          default: chat with **AI**
          source: login
      attrs:
        class:
        - shadow
        - nogrow
        format: md
    - type: form
      bind:
        value:
          kind: event
          event: login
      children:
      - type: button
        bind:
          value:
            kind: default
            default: LOGIN
        submit: true
  - type: rack
    attrs:
      class:
      - box
      - ac-start
      - gap
      - scrolly
      scroll: true
    bind:
      value:
        kind: source
        source: chat
    item:
    - type: case
      attrs:
        class:
        - box
        - border
        - shadow
        - nogrow
        - as-end
        - accent
        selector: ask
    - type: case
      attrs:
        class:
        - box
        - border
        - shadow
        - nogrow
        - as-start
  - type: case
    attrs:
      class:
      - nogrow
      - box
      horizontal: true
    children:
    - type: case
      attrs:
        horizontal: true
      children:
      - type: input
        bind:
          value:
            kind: event
            event: history
      - type: input
        bind:
          value:
            kind: event
            event: echo

