# G2 line trend + department radar (ADR 0009, pure GoG spec; the line spec goes through the data slot `trend`, the three radar specs through
# the data slots `radar_rd` / `radar_mkt` / `radar_ops` — all four chart specs go through slots:
# a module host with an empty payload takes up no space (ADR 0012), so "send the row first, the data later" lets you watch the charts
# expand one after another; sending the four specs in a single frame behaves as before).
# Mock data for the daily ratings: the three departments have different dimension counts — R&D has 5 (attendance discipline / work quality / workload
# input / collaboration & communication / learning & growth), Marketing has 6 (plus innovation), Operations has 7 (plus customer awareness),
# scored 0–5; 11 people × 3 departments. The axis count is decided by the data's dim values; the spec has no dimension-count knob.
# Six frames: append one row (the outer frame uses grid to split the container into three tracks — line chart / radar charts /
#   summary) + set `trend` (the line spec) + set `summary` (the summary text) + set the three
#   radar specs (set frames can be sent as a whole, or only the ones you need).
#   (grid-template-rows: minmax(160px, 1fr) minmax(360px, 2fr) auto + a fixed
#   height — the min value pins a floor under the radar track: the polar radius is limited by min(width, height)/2, so if the row height drops
#   the chart shrinks with it; 1fr defaults to minmax(auto,1fr), and an auto minimum lets the canvas content push its own row taller,
#   making the rows uneven, so a min must be given; the summary track keeps auto, and as it grows token by token it squeezes the two tracks that carry a min
#   track; chart has no height field and takes its size purely from autoFit reading the container, so the container must be given a definite height,
#   otherwise the sub-chart collapses to 0).
#   the radar row is itself a three-column grid (repeat(3, minmax(0,1fr))) — not flex + .f: .f is
#   flex:1 0 auto (basis taken from the content), and the three canvases have unequal bases → unequal widths (measured
#   531/531/402); equal column widths do not depend on content.
#   Top: the change in department averages, all three departments in one coordinate system (color = dept), shape: smooth for smoothed
#       curves, with the data being mock values from a random walk. This file carries only the first 15 days (09-03…09-17);
#       the last 15 days (09-18…10-02) are patched day by day into the `trend` slot
#       (/source/default/data) as appends (see below).
#   Middle: three independent charts side by side in equal thirds (a three-column grid, one radar coordinate system per department; each bound to
#       a radar_* slot, with the spec in the set frames at the end of the file),
#       one closed polygon per person within a department — area with a semi-transparent fill (fillOpacity 0.15 +
#       lineWidth: 0, no stroke outline), line for straight-edged polylines (smooth turns the stroke into Béziers and
#       breaks away from the straight-edged polygon, so it was dropped; join/cap: round only rounds the corner joins,
#       without changing the path), color = name to tell people apart. The faceting approach (facetRect
#       squeezing three cells into one chart) is abandoned: axes stack on axes inside the small cells and the whole thing gets squeezed. facetRect lexical reference:
#       top-level composition + the encode.x facet field; the nested view+transform:[facetRect]
#       form does not exist.
#       How to keep the first and last radar axes from coinciding: a point scale spreads N dimensions over 0…1 by default, and under polar 0 and 1
#       are the same angle — the first and last axes land on exactly the same pixels (coincide); `paddingOuter` does nothing to this version's point scale
#       (measured: the paddingOuter 1/2 mappings are unchanged). The official recipe is to give the scale itself
#       `padding: 0.5` + `align: 0`: each dimension takes one slot and the first lands straight up, with the N axes spaced
#       360/N degrees apart, no gap — the axis count comes only from the data's dim values, and the three charts have 5/6/7 axes. Hand-assembling
#       `range` (the example at the time was [-1/6, 2/3] for 6 dimensions) also spaces them out, but leaves a 60° gap
#       and pushes the last dimension against the canvas edge — the label is clipped and there is no hoverable mark near that axis.
#   Bottom: the summary row (text, bound to the `summary` slot, starting from an empty string); the demo script patches it into the slot token by token
#       at /source/default as appends.
# Streaming content (day-by-day data, token-by-token summaries) all goes through data slots: writing a layout node re-renders the whole row and
#   re-mounts the module host (measured, see docs/PLAN.md), whereas a slot write only notifies that slot's subscribers. The row carries no id:
#   this file can be /send-ed repeatedly (no id = a positional row, so repeated pushes do not conflict), and appends are not row-addressed.
# Usage: send examples/yaml/00.main.yaml first (the graph-left, stream-right skeleton), then send this file
#       (append a row into the chat rack + set five slots). Combined demo
#       python3 examples/walkthrough.py builds a row of its own, taking only this file's set frames
#       as the sole source of chart data (sending the whole file opens an extra box), then fills it in streaming segments.
- action: append
  slot: chat
  data:
    type: frame
    attrs:
      class:
      - gap
      grid:
        grid-template-rows: minmax(160px, 1fr) minmax(360px, 2fr) auto
        height: 70vh
    children:
    - type: canvas
      url: /assets/g2chart/index.js
      id: dept-trend
      attrs:
        class:
        - flex
      source: {slot: trend}
    - type: frame
      id: radar-row
      attrs:
        class:
        - gap
        grid:
          grid-template-columns: repeat(3, minmax(0, 1fr))
      children:
      - type: canvas
        url: /assets/g2chart/index.js
        id: radar-rd
        attrs:
          class:
          - flex
        source: {slot: radar_rd}
      - type: canvas
        url: /assets/g2chart/index.js
        id: radar-mkt
        attrs:
          class:
          - flex
        source: {slot: radar_mkt}
      - type: canvas
        url: /assets/g2chart/index.js
        id: radar-ops
        attrs:
          class:
          - flex
        source: {slot: radar_ops}

    - type: text
      attrs:
        class:
        - box
        format: md
      source: {slot: summary}

# Chart data and the summary go through data slots (ADR 0005: set creates the slot, pointer patch appends) — streaming content
