# G2 折线趋势 + 部门雷达（ADR 0009，纯 GoG spec 直装 bind.value.default）。
# 日记评分模拟数据：6 维度（出勤纪律/工作质量/工作量投入/协作沟通/学习成长/
# 创新性，0–5 分），11 人 × 3 部门。
# 一个 append 帧：外层 case 用 grid 把容器分成上下两部分（grid-template-rows
#   minmax(0,1fr) ×2 + 固定 height——1fr 默认 minmax(auto,1fr)，auto 最小值会让
#   画布内容撑高自己的行、两行不等分，须 minmax(0,..) 钉死；chart 无 height
#   字段、尺寸全靠 autoFit 读容器，故必须给容器确定高度，否则子图塌成 0）。
#   上：近 30 天部门平均分变化，三个部门同一坐标系（color = dept），
#       shape: smooth 平滑曲线，数据为随机游走造的模拟值。
#   下：三个独立 chart 水平排列（case horizontal，每部门一个雷达坐标系），
#       部门内每人一个闭合多边形——area 半透明填充（fillOpacity 0.15 +
#       lineWidth: 0，无描边边框），line 直边折线（smooth 会贝塞尔化描边、
#       脱离直边多边形，已去掉；join/cap: round 只圆化拐角连接处，
#       不改路径），color = name 区分人。分面方案（facetRect
#       三格挤一图）已弃：小格内轴叠轴、整体挤压。facetRect 词法备查：
#       顶层 composition + encode.x 分面字段；view+transform:[facetRect]
#       嵌套写法不存在。
# 用法：依次 send examples/yaml/00.main.yaml（骨架 + home/about）、
#       examples/yaml/00.chat.yaml（chat 页进菜单），再 send 本文件
#       （一帧 append 进 chat rack）。
