# 本地联动数据帧（ADR 0008 + ADR 0010 形状修订）：给菜单布局喂选项。
# options 走 list 平面（source "menu"），服务端职责不变；
# 联动（select→chan 槽→标题）纯前端。ADR 0010：local 落槽载荷是与上行
# 同形的包装对象 {slot, id?, data}——订阅方读值因此带 path（标题取
# /data）。选中第二项后，stage console 不应出现任何上行事件。
- action: create
  slot: ""
  data:
    type: frame
    attrs:
      class:
      - maximize
    children:
    - type: frame
      attrs:
        class:
        - --header
        - nogrow
      children:
      - type: text
        attrs:
          format: md
        source:
          slot: chan
          scope: local
          path: /data
          default: "**未选频道**"
    - type: frame
      attrs:
        class:
        - --body
        - shrink
        - is-border
        - round
        horizontal: true
      children:
      - type: select
        source: {slot: chan, scope: local}
        sink: {slot: chan, scope: local}
        options: {slot: menu}
- action: append
  slot: menu
  data:
    type: text
    id: general
    source: {default: 综合频道}
- action: append
  slot: menu
  data:
    type: text
    id: tech
    source: {default: 技术频道}
