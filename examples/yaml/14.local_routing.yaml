# 本地联动数据帧（ADR 0008 + ADR 0010 形状修订）：给菜单布局喂选项。
# options 走 list 平面（source "menu"），服务端职责不变；
# 联动（select→chan 槽→标题）纯前端。ADR 0010：local 落槽载荷是与上行
# 同形的包装对象 {event, id?, data}——订阅方读值因此带 path（标题取
# /data）。选中第二项后，stage console 不应出现任何上行事件。
- action: create
  event: ""
  data:
    type: case
    attrs:
      class:
      - maximize
    children:
    - type: case
      attrs:
        class:
        - --header
        - nogrow
      children:
      - type: text
        attrs:
          format: md
        bind:
          value:
            kind: local
            slot: chan
            path: /data
            default: "**未选频道**"
    - type: case
      attrs:
        class:
        - --body
        - shrink
        - border
        - round
        horizontal: true
      children:
      - type: select
        bind:
          value:
            kind: local
            slot: chan
          options:
            kind: source
            source: menu
- action: append
  event: menu
  data:
    type: text
    id: general
    bind:
      value:
        kind: default
        default: 综合频道
- action: append
  event: menu
  data:
    type: text
    id: tech
    bind:
      value:
        kind: default
        default: 技术频道
