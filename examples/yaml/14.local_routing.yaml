# Local linked data frames (ADR 0008 + the ADR 0010 shape revision): feed options to the menu layout.
# options go through the list plane (source "menu"), and the server-side duty is unchanged;
# the linkage (select→chan slot→title) is purely frontend. ADR 0010: the local slot payload is a wrapper
# object {slot, id?, data} of the same shape as uplink — so subscribers reading the value take a path (the title reads
# /data). After the second item is selected, the stage console should show no uplink event at all.
- action: create
  slot: ""
  data:
    type: frame
    attrs:
      class:
      - maximize
    children:
    - type: frame
      attrs:
        class:
        - --header
        - nogrow
      children:
      - type: text
        attrs:
          format: md
        source:
          slot: chan
          scope: local
          path: /data/chan
          default: "**未选频道**"
    - type: frame
      attrs:
        class:
        - --body
        - shrink
        - is-border
        - round
        horizontal: true
      children:
      - type: bundle
        attrs: {submit: [change]}
        sink: {dest: chan, scope: local}
        children:
        - type: select
          tag: chan
          source: {slot: chan, scope: local}
          options: {slot: menu}
- action: append
  slot: menu
  data:
    type: text
    id: general
    source: {default: 综合频道}
- action: append
  slot: menu
  data:
    type: text
    id: tech
    source: {default: 技术频道}
