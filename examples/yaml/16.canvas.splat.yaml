# Canvas example (ADR 0007): the splatviewer module — Gaussian splat scene display.
# Prerequisites: the module is in examples/renderer/assets/splatviewer/ (plain JS, no build; recipe in the
# header comment of examples/modules/splatviewer/index.js); the layout side sends 00.main.yaml first.
# The splat assets truck.ksplat / bonsai.ksplat come from the
# official GaussianSplats3D demo data (INRIA 3DGS dataset scenes, demo use, shipped with the repository;
# licence follows the source scenes — research/demo use, verify yourself for commercial use).
#
# One separate message per scene (one canvas per box): data slots are single-valued, so if two canvases
# subscribe to the same slot only the set written later takes effect; hence each hangs on its own slot (splat_truck /
# splat_bonsai) and both payloads reach their own module.
#
# The camera trio is taken from the matching pages of the official GaussianSplats3D demo (demo/truck.html,
# demo/bonsai.html) — 3DGS datasets come with coordinate systems pointing in various directions; without them you get GS3D's default
# camera ([0,10,15] looking at the origin, up=[0,1,0]), and the view is skewed.
- action: append
  slot: chat
  data:
    type: canvas
    url: /assets/splatviewer/index.js
    attrs:
      width: 600px
      height: 400px
    source: {slot: splat_truck}
- action: append
  slot: chat
  data:
    type: canvas
    url: /assets/splatviewer/index.js
    attrs:
      width: 600px
      height: 400px
    source: {slot: splat_bonsai}
- action: set
  slot: splat_truck
  data:
    type: frame
    source:
      default:
        assets:
          scene: /assets/splatviewer/truck.ksplat
        camera:
          up: [0, -1, -0.17]
          position: [-5, -1, -1]
          lookAt: [-1.72477, 0.05395, -0.00147]
- action: set
  slot: splat_bonsai
  data:
    type: frame
    source:
      default:
        assets:
          scene: /assets/splatviewer/bonsai.ksplat
        camera:
          up: [0.01933, -0.75830, -0.65161]
          position: [1.54163, 2.68515, -6.37228]
          lookAt: [0.45622, 1.95338, 1.51278]
