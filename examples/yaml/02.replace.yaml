# Replace demo (ADR 0005): the row is appended once (id `s2`), then the
# frame replaces the cell's whole value (op: replace — not the retired
# positional Replace-merge). Send the row once, then re-send repeatedly.
- action: append
  slot: chat
  data:
    type: frame
    id: s2
    attrs:
      class:
      - flex
      - col
      - gap
      - xxx
      - gap-md
    children:
    - type: text
      attrs:
        format: md
        class:
        - tone-clear
      source: {default: old}
- action: patch
  slot: chat
  id: s2
  path: /children/0/source/default
  op: replace
  value: ===
