# panel 示例（ADR 0030/0031）：模态登录框。
#
# 1) 布局根 append 一个 panel = 显式声明的挂载点；显隐只有一条规则：
#    所绑 local 槽 `login_modal` 非空即显示（ADR 0012「空即无」）。
# 2) chat 行里放触发输入框（回车写槽 = 打开）。内容直接长在面板里 ——
#    portal 已删除：槽是全局的，谁绑谁显示，不需要把子树搬运到别处。
#    点卡片外的模糊区关闭 = 清空该槽；槽空过，再回车即重开
#    （下次写入必是新值，「同值不写」不会误挡）。
# 前置：先发 00.main.yaml。
- action: patch
  slot: ""
  path: /children
  op: append
  value:
    type: panel
    id: login_layer
    attrs:
      place: viewport
      state: bound
      dismiss: true
    source: {slot: login_modal, scope: local}
    children:
    - type: bundle
      sink: {slot: login}
      attrs:
        submit: [enter, button]
      children:
      - type: frame
        attrs:
          class: [is-border, round, is-shadow]
          grid:
            width: 26rem
            flex: 0 0 auto
        children:
        - type: text
          attrs:
            format: md
          source:
            default: "**登录（示例）**\n\n任意账号密码即可：回车或点按钮把字段上行到 stage 控制台；点卡片外的模糊区关闭（清空槽），再回车重开。"
        - type: input
          tag: user
          source: {default: ""}
        - type: input
          tag: pass
          source: {default: "", type: password}
        - type: button
          attrs:
            oneshot: false
          sink: {}
          source: {default: 登录}
- action: append
  slot: chat
  data:
    type: frame
    id: login_demo
    attrs:
      class: [flex, col, gap]
    children:
    - type: input
      source:
        default: "回车打开登录框"
      sink: {slot: login_modal, scope: local}