# panel example (ADR 0030/0031): a modal login box.
#
# 1) append one panel to the layout root = an explicitly declared mount point; visibility has a single rule:
#    visible as soon as the bound local slot `login_modal` is non-empty (ADR 0012 "empty means absent").
# 2) the trigger input goes in a chat row (enter writes the slot = open). The content grows right inside the panel —
#    portal is gone: slots are global, whoever binds one shows it, there is no need to carry the subtree elsewhere.
#    Clicking the blurred area outside the card closes it = clears that slot; once the slot has been empty, enter reopens it
#    (the next write is bound to be a new value, so "don't write equal values" cannot block it by mistake).
# Prerequisites: send 00.main.yaml first.
- action: patch
  slot: ""
  path: /children
  op: append
  value:
    type: panel
    id: login_layer
    attrs:
      place: viewport
      state: bound
      dismiss: true
    source: {slot: login_modal, scope: local}
    children:
    - type: bundle
      sink: {dest: login}
      attrs:
        submit: [enter, button]
      children:
      - type: frame
        attrs:
          class: [is-border, round, is-shadow]
          grid:
            width: 26rem
            flex: 0 0 auto
        children:
        - type: text
          attrs:
            format: md
          source:
            default: "**登录（示例）**\n\n任意账号密码即可：回车或点按钮把字段上行到 stage 控制台；点卡片外的模糊区关闭（清空槽），再回车重开。"
        - type: input
          tag: user
          source: {default: ""}
        - type: input
          tag: pass
          kind: password
          source: {default: ""}
        - type: button
          attrs:
            oneshot: false
          sink: {}
          source: {default: 登录}
- action: append
  slot: chat
  data:
    type: frame
    id: login_demo
    attrs:
      class: [flex, col, gap]
    children:
    - type: bundle
      attrs: {submit: [enter]}
      sink: {dest: login_modal, scope: local}
      children:
      - type: input
        tag: open
        source:
          default: "回车打开登录框"