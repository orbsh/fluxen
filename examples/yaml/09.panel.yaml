action: append
slot: chat
data:
  attrs:
    class: [flex, col, gap, xxx, gap-md]
  children:
  - type: frame
  - type: frame
  # Collapsible region (ADR 0030): the inline cell of panel — the head is children[0], clicking it toggles,
  # the body is the children that follow. The old fold node has been removed.
  - attrs:
      class: [box, pad-sm, text-sm, is-border, round, warn, is-pointer, is-highlight, is-ease]
      place: inline
    children:
    - attrs: {class: [text, text-sm, hint]}
      type: text
      source: {default: PartStarting}
    - attrs: {}
      type: frame
      children:
      - attrs: {class: [txt, sm, hint], format: md}
        type: text
        source: {default: test}
    type: panel
  type: frame