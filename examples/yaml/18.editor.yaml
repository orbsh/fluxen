# Code editor example (ADR 0016): Monaco goes through the module channel (ADR 0007), and the library is only pulled in mount()
# (ADR 0015); saving = Ctrl/Cmd+S inside the editor → uplink `{code, lang}` (the same leg as form submit).
# Prerequisites: the wrapper module is in examples/renderer/assets/editor/ (plain JS, no build; recipe in the
# header comment of examples/renderer/modules/editor/index.js), and Monaco's AMD subset is in
# examples/renderer/assets/monaco/vs/ (same story — both are gitignored build artifacts);
# the layout side sends 00.main.yaml first.
#
# One of each of the two shapes, showing two data sources for the same contract:
#   1. inline payload ("code as an argument") — the data area is literally {code, lang}, and the node carries only a size;
#   2. bound slot (source) — the editor neither takes up space nor imports anything up front (ADR 0012/0015):
#      the set below sends the code into the slot, and only then does the editor show up (the shape for drafting / streaming review).
# Save uplink: click into either editor and press Ctrl+S; the `<-` block of the stage console prints
# event: submit + that node's id + {code, lang}.
- action: append
  slot: chat
  data:
    type: canvas
    url: /assets/editor/index.js
    id: patch-inline
    attrs:
      width: 100%
      height: 320px
    source:
      default:
        code: |
          fn main() {
              println!("hello, accrete");
          }
        lang: rust
- action: append
  slot: chat
  data:
    type: canvas
    url: /assets/editor/index.js
    id: patch-staged
    attrs:
      width: 100%
      height: 240px
    source: {slot: staged_code}
# The payload shape in the slot is exactly the same as inline (the host takes the slot node's `source.default` and pushes it to the module as is).
- action: set
  slot: staged_code
  data:
    type: frame
    source:
      default:
        code: |
          def accrete(*parts):
              return sum(parts)
        lang: python
