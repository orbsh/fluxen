# Native force-directed graph component (ADR 0018): a `forcegraph` node, not a canvas module.
#
# This is not a kind of canvas but a component of its own (ADR 0029). The difference from canvas modules is structural:
#   * there is no `url` — the renderer and the layout both live in wasm (crates/forcegraph), with no JS asset,
#     no mount/update/resize/unmount contract, no 3d-force-graph and no three.js.
#   * there is no dynamic `options` bag — the knobs are the `style` struct in the DSL, with typed fields that
#     the schema and patch validation can check.
#   * the framing rule has changed: `auto_fit` only takes effect on the first non-empty payload; later appends do not re-lay out and do not fly
#     the camera; new points settle next to their neighbours (a stable layout is the precondition for navigation).
#
# The way data is fed is unchanged: every frame sends a whole snapshot (`{nodes, links, focus?}`), and the component diffs
# by node id, so repeated delivery is idempotent. `focus` is a view instruction: `{ids, seq?}`; when `seq` changes the same
# target can be flown to once more; a repeated write that does not raise `seq` leaves the camera alone.
#
# Prerequisites: the layout side sends 00.main.yaml first. This file depends on no module assets.

# ---- frame 1: skeleton (an empty payload takes up no space, ADR 0012) ---------
- action: append
  slot: chat
  data:
    type: forcegraph
    attrs:
      width: 100%
      height: 460px
    style:
      # diameter = 2 × edge width; without node_size_px, the size is decided by this ratio alone.
      node_size_ratio: 2
      link_width_px: 2.5
      link_opacity: 0.85
      # External highlight (the focus instruction) does not dim the other nodes; it lights the path one edge out from the selected point instead.
      highlight_reach: true
      reach_hops: 1
      fit_padding_px: 56
      # Edge direction: straight connects directly (default); axes goes along ±x ±y ±z; tetra goes along the four directions of a regular tetrahedron.
      # The buttons on the panel can switch this at runtime.
      link_shape: straight
    source: {slot: mfg}

# ---- frame 2: crate layer -----------------------------------------------------
- action: set
  slot: mfg
  data:
    type: frame
    source:
      default:
        focus: null
        nodes:
          - {id: accrete, name: accrete, kind: crate, weight: 9}
          - {id: ui_leptos, name: ui_leptos, kind: crate, weight: 8}
          - {id: content, name: content, kind: crate, weight: 7}
          - {id: transport, name: transport, kind: crate, weight: 5}
          - {id: stage, name: stage, kind: crate, weight: 6}
        links:
          - {source: ui_leptos, target: accrete, kind: renders, strength: 5}
          - {source: stage, target: content, kind: encodes, strength: 4}
          - {source: stage, target: ui_leptos, kind: serves, strength: 3}
          - {source: transport, target: content, kind: carries, strength: 3}

# ---- frame 3: component layer -------------------------------------------------
- action: set
  slot: mfg
  data:
    type: frame
    source:
      default:
        focus: null
        nodes:
          - {id: accrete, name: accrete, kind: crate, weight: 9}
          - {id: ui_leptos, name: ui_leptos, kind: crate, weight: 8}
          - {id: content, name: content, kind: crate, weight: 7}
          - {id: transport, name: transport, kind: crate, weight: 5}
          - {id: stage, name: stage, kind: crate, weight: 6}
          - {id: canvas, name: canvas, kind: component, weight: 7}
          - {id: chart, name: chart, kind: component, weight: 6}
          - {id: editor, name: editor, kind: component, weight: 6}
          - {id: rack, name: rack, kind: component, weight: 6}
          - {id: pages, name: pages, kind: component, weight: 5}
        links:
          - {source: ui_leptos, target: accrete, kind: renders, strength: 5}
          - {source: stage, target: content, kind: encodes, strength: 4}
          - {source: stage, target: ui_leptos, kind: serves, strength: 3}
          - {source: transport, target: content, kind: carries, strength: 3}
          - {source: canvas, target: accrete, kind: node, strength: 2}
          - {source: rack, target: pages, kind: rows, strength: 3}
          - {source: canvas, target: ui_leptos, kind: mounted-by, strength: 3}
          - {source: chart, target: ui_leptos, kind: mounted-by, strength: 3}
          - {source: editor, target: ui_leptos, kind: mounted-by, strength: 3}

# ---- frame 4: external module layer (appends do not re-lay out, no camera flight) ----
- action: set
  slot: mfg
  data:
    type: frame
    source:
      default:
        focus: null
        nodes:
          - {id: accrete, name: accrete, kind: crate, weight: 9}
          - {id: ui_leptos, name: ui_leptos, kind: crate, weight: 8}
          - {id: content, name: content, kind: crate, weight: 7}
          - {id: transport, name: transport, kind: crate, weight: 5}
          - {id: stage, name: stage, kind: crate, weight: 6}
          - {id: canvas, name: canvas, kind: component, weight: 7}
          - {id: chart, name: chart, kind: component, weight: 6}
          - {id: editor, name: editor, kind: component, weight: 6}
          - {id: rack, name: rack, kind: component, weight: 6}
          - {id: pages, name: pages, kind: component, weight: 5}
          - {id: forcegraph, name: forcegraph, kind: native, weight: 7}
          - {id: browser3d, name: 3dbrowser, kind: module, weight: 5}
          - {id: splatviewer, name: splatviewer, kind: module, weight: 5}
          - {id: g2chart, name: g2chart, kind: module, weight: 4}
          - {id: monaco, name: monaco, kind: lib, weight: 7}
        links:
          - {source: ui_leptos, target: accrete, kind: renders, strength: 5}
          - {source: stage, target: content, kind: encodes, strength: 4}
          - {source: stage, target: ui_leptos, kind: serves, strength: 3}
          - {source: transport, target: content, kind: carries, strength: 3}
          - {source: canvas, target: accrete, kind: node, strength: 2}
          - {source: rack, target: pages, kind: rows, strength: 3}
          - {source: canvas, target: ui_leptos, kind: mounted-by, strength: 3}
          - {source: chart, target: ui_leptos, kind: mounted-by, strength: 3}
          - {source: editor, target: ui_leptos, kind: mounted-by, strength: 3}
          - {source: forcegraph, target: accrete, kind: node, strength: 3}
          - {source: browser3d, target: canvas, kind: mounts, strength: 4}
          - {source: splatviewer, target: canvas, kind: mounts, strength: 4}
          - {source: g2chart, target: chart, kind: mounts, strength: 3}
          - {source: monaco, target: editor, kind: mounts, strength: 5}

# ---- frame 5: focus (the equivalent of hitting search) ------------------------
# The same snapshot + focus: the camera flies to this cluster and the rest does not vanish (highlighting is decided by the renderer from focus).
# `seq` must change — otherwise delivering the same target again does not fly there again.
- action: set
  slot: mfg
  data:
    type: frame
    source:
      default:
        focus: {ids: [accrete, content, transport], seq: 1}
        nodes:
          - {id: accrete, name: accrete, kind: crate, weight: 9}
          - {id: ui_leptos, name: ui_leptos, kind: crate, weight: 8}
          - {id: content, name: content, kind: crate, weight: 7}
          - {id: transport, name: transport, kind: crate, weight: 5}
          - {id: stage, name: stage, kind: crate, weight: 6}
          - {id: canvas, name: canvas, kind: component, weight: 7}
          - {id: chart, name: chart, kind: component, weight: 6}
          - {id: editor, name: editor, kind: component, weight: 6}
          - {id: rack, name: rack, kind: component, weight: 6}
          - {id: pages, name: pages, kind: component, weight: 5}
          - {id: forcegraph, name: forcegraph, kind: native, weight: 7}
          - {id: browser3d, name: 3dbrowser, kind: module, weight: 5}
          - {id: splatviewer, name: splatviewer, kind: module, weight: 5}
          - {id: g2chart, name: g2chart, kind: module, weight: 4}
          - {id: monaco, name: monaco, kind: lib, weight: 7}
        links:
          - {source: ui_leptos, target: accrete, kind: renders, strength: 5}
          - {source: stage, target: content, kind: encodes, strength: 4}
          - {source: stage, target: ui_leptos, kind: serves, strength: 3}
          - {source: transport, target: content, kind: carries, strength: 3}
          - {source: canvas, target: accrete, kind: node, strength: 2}
          - {source: rack, target: pages, kind: rows, strength: 3}
          - {source: canvas, target: ui_leptos, kind: mounted-by, strength: 3}
          - {source: chart, target: ui_leptos, kind: mounted-by, strength: 3}
          - {source: editor, target: ui_leptos, kind: mounted-by, strength: 3}
          - {source: forcegraph, target: accrete, kind: node, strength: 3}
          - {source: browser3d, target: canvas, kind: mounts, strength: 4}
          - {source: splatviewer, target: canvas, kind: mounts, strength: 4}
          - {source: g2chart, target: chart, kind: mounts, strength: 3}
          - {source: monaco, target: editor, kind: mounts, strength: 5}
