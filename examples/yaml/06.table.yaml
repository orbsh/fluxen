# A table = `tiles` + `fields` (ADR 0031 §4): no `<table>`, hence no thead/tbody/tr/th/td.
# Each row of data is an `entry`, and fields are named with `attrs.selector` (ADR 0020's rule: a selector
# singles out one child node among its siblings), and `fields`' `key` projects a field into a cell.
# The header is not an element but a hook: `header: {selector, layers: 2}` puts that selector on every header cell;
# the two header rows grow out of the keys themselves — `price/retail` sits under the `price` group, and the group cell covers the columns beneath it.
# `layers` rather than `rows`: when `dir: row` the header is a column, not a row (ADR 0035); this table is the default
# `col` (elements flow top to bottom), so the header is still the row on top.
# Merged cells (colspan/rowspan) do not exist in the model: hierarchical data is written as nested entries and rendered as child rows.
- action: append
  slot: chat
  data:
    type: loom
    id: table-form
    attrs:
      submit: [enter, button]
    children:
    - type: text
      source: {default: ''}
    - type: frame
      attrs:
        class: [gap, gap-md]
      children:
      - type: tiles
        attrs:
          class: [--table]
          fields:
          - {key: qty, title: Qty, width: 5rem}
          - {key: name, title: Name}
          - {key: price/retail, title: Retail, width: 6rem, align: end}
          - {key: price/list, title: List, width: 6rem, align: end}
          - {key: note, title: Note}
          header: {selector: --table-head, layers: 2}
        source: {slot: table-rows}
    - type: button
      attrs:
        oneshot: false
# ---- rows: one entry per item; `id` is its key (stage/step reuse the same set of keys) ----
- action: append
  slot: table-rows
  data:
    type: entry
    id: '853736'
    children:
    - type: loom
      attrs: {selector: qty, submit: [change]}
      sink: {dest: s, scope: local}
      children:
      - type: input
        tag: qty
        kind: text
        source: {default: '853736'}
    - type: text
      attrs: {selector: name}
      source: {default: a1}
    - type: text
      attrs: {selector: price/retail}
      source: {default: 2.25}
    - type: text
      attrs: {selector: price/list}
      source: {default: a2}
    - type: text
      attrs: {selector: note}
      source: {default: a3}
