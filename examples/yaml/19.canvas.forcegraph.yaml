            - {source: canvas, target: ui_leptos, kind: mounted-by, strength: 3}
            - {source: chart, target: ui_leptos, kind: mounted-by, strength: 3}
            - {source: editor, target: ui_leptos, kind: mounted-by, strength: 3}

