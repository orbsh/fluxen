action: create
slot: ""
data:
  attrs:
    class:
    - maximize
  type: frame
  children:
  - type: text
    source:
      slot: login
      default: "**chat**"
    attrs:
      class:
      - --header
      - nogrow
      format: md
  - type: frame
    attrs:
      horizontal: true
      class:
      - --body
      - shrink
      - border
      - round
    children:
    - type: frame
      attrs:
        class:
        - --leftside
        - nogrow
      children:
      - type: text
        attrs:
          format: md
          class:
          - box
        source:
          default: "**channel**"
      - type: select
        attrs:
          class:
          - --channel
          - ji-center
          - nogrow
        sink:
          slot: channel::select
          default: "2"
        options: {slot: channel::list}
    - type: frame
      attrs:
        class:
        - main
        - shrink
      children:
      - type: frame
        children:
        - type: rack
          attrs:
            class:
            - --message
            - box
            - ac-start
            - gap
            - scrolly
            scroll: true
          source: {slot: chat}
          item:
          - type: frame
            attrs:
              class:
              - nogrow
              - as-end
              - accent
              - box
              - border
              - round
              - shadow
              selector: ask
          - type: frame
            attrs:
              class:
              - nogrow
              - as-stretch
              - box
              - border
              - round
              - shadow
        - type: panel
          attrs:
            place: viewport
            state: bound
            bottom: 0.2rem
            left: 1rem
            class: [--cart, box, border, shadow, primary]
          source: {slot: cart}
          children:
          - type: template
            name: cart
            data: {}
          - type: frame
            children:
            - type: text
              source: {default: a}
            - type: text
              source: {default: b}
            - type: text
              source: {default: c}
      - type: frame
        attrs:
          class:
          - --input
          - nogrow
          - box
          horizontal: true
        children:
        - type: frame
          attrs:
            horizontal: true
          children:
          - type: input
            sink: {slot: message}

