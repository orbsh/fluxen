action: create
event: ""
data:
  attrs:
    class:
    - maximize
  type: case
  children:
  - type: text
    bind:
      value:
        kind: source
        default: "**chat**"
        source: login
    attrs:
      class:
      - --header
      - nogrow
      format: md
  - type: case
    attrs:
      horizontal: true
      class:
      - --body
      - shrink
      - border
      - round
    children:
    - type: case
      attrs:
        class:
        - --leftside
        - nogrow
      children:
      - type: text
        attrs:
          format: md
          class:
          - box
        bind:
          value:
            kind: default
            default: "**channel**"
      - type: select
        attrs:
          class:
          - --channel
          - ji-center
          - nogrow
        bind:
          value:
            kind: event
            event: channel::select
            default: "2"
          options:
            kind: source
            source: channel::list
    - type: case
      attrs:
        class:
        - main
        - shrink
      children:
      - type: case
        children:
        - type: rack
          attrs:
            class:
            - --message
            - box
            - ac-start
            - gap
            - scrolly
            scroll: true
          bind:
            value:
              kind: source
              source: chat
          item:
          - type: case
            attrs:
              class:
              - nogrow
              - as-end
              - accent
              - box
              - border
              - round
              - shadow
              selector: ask
          - type: case
            attrs:
              class:
              - nogrow
              - as-stretch
              - box
              - border
              - round
              - shadow
        - type: float
          attrs:
            bottom: 0.2rem
            left: 1rem
          children:
          - type: popup
            attrs:
              class:
              - --cart
              - box
              - border
              - shadow
              - primary
              direction: U
            bind:
              value:
                kind: source
                source: cart
            children:
            - type: template
              name: cart
              data: {}
            - type: case
              children:
              - type: text
                bind:
                  value:
                    kind: default
                    default: a
              - type: text
                bind:
                  value:
                    kind: default
                    default: b
              - type: text
                bind:
                  value:
                    kind: default
                    default: c
      - type: case
        attrs:
          class:
          - --input
          - nogrow
          - box
          horizontal: true
        children:
        - type: case
          attrs:
            horizontal: true
          children:
          - type: input
            bind:
              value:
                kind: event
                event: message

