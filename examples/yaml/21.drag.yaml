# ADR 0034: both ends of a drag live on frames. The two rows on the left are draggable (the source frame's id is the row's identity,
# the cargo is its own subtree), while the right side has two drop targets: rail accepts only tag=message and emits a pin;
# trash accepts only tag=note — neither of the two things dragged here matches it, so dropping there is as good as not dropping.
# Several drop targets on one page are kept apart by event name; no extra addressing is needed.
action: create
slot: ""
data:
  type: frame
  attrs:
    class:
    - maximize
    horizontal: true
  children:
  - type: frame
    attrs:
      class:
      - box
      - gap
    children:
    - type: text
      attrs:
        class:
        - bold
      source: {default: 信息流}
    - type: frame
      id: m42
      attrs:
        draggable: {tag: message}
      children:
      - type: text
        attrs:
          class:
          - box
          - is-border
          - round
        source: {default: 批量导出一万多条的时候，进度条就不动了}
    - type: frame
      id: m43
      attrs:
        draggable: {tag: message}
      children:
      - type: text
        attrs:
          class:
          - box
          - is-border
          - round
        source: {default: 同一件事，另一家客户也报了}
  - type: frame
    id: rail
    attrs:
      class:
      - box
      accept: {tag: message}
    sink: {slot: pin}
  - type: frame
    id: trash
    attrs:
      class:
      - box
      accept: {tag: note}
    sink: {slot: archive}
