# ADR 0034: 拖拽的两端都在 frame 上。左边两行可拖（源框的 id 就是行的身份，
# 货物就是它自己的子树），右边两个落点：rail 只收 tag=message、发 pin；
# trash 只收 tag=note——这次拖的两个都配不上它，落上去等于没落。
# 同页多落点靠事件名分开，不用额外寻址。
action: create
slot: ""
data:
  type: frame
  attrs:
    class:
    - maximize
    horizontal: true
  children:
  - type: frame
    attrs:
      class:
      - box
      - gap
    children:
    - type: text
      attrs:
        class:
        - bold
      source: {default: 信息流}
    - type: frame
      id: m42
      attrs:
        draggable: {tag: message}
      children:
      - type: text
        attrs:
          class:
          - box
          - is-border
          - round
        source: {default: 批量导出一万多条的时候，进度条就不动了}
    - type: frame
      id: m43
      attrs:
        draggable: {tag: message}
      children:
      - type: text
        attrs:
          class:
          - box
          - is-border
          - round
        source: {default: 同一件事，另一家客户也报了}
  - type: frame
    id: rail
    attrs:
      class:
      - box
      accept: {tag: message}
    sink: {slot: pin}
  - type: frame
    id: trash
    attrs:
      class:
      - box
      accept: {tag: note}
    sink: {slot: archive}
