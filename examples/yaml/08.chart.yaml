# G2 流式追点（ADR 0009 + ADR 0005）：先 append 一行图，再 op:append 数据行进 spec 的
# data 数组（append 语义 = push 目标数组，指针指向数组本身）——封装模块
# 整 spec 重设 + chart.update() 增量重绘，即 token 流驱动的实时曲线。
- action: append
  event: chat
  data:
    type: chart
    id: stream-chart
    attrs:
      class:
      - f
    bind:
      value:
        kind: default
        default:
          type: line
          data:
          - {day: Dec 01, value: 55}
          - {day: Dec 02, value: 69}
          encode:
            x: day
            y: value
          interaction:
            tooltip: {}
- action: patch
  event: chat
  id: stream-chart
  # op:append 在数组上 = 尾部 push（ADR 0005 的流式累加语义）
  path: /bind/value/default/data
  op: append
  value: {day: Dec 03, value: 45}

