# G2 multiple series + streaming point appends (ADR 0009 + ADR 0005): 11 days × two teams in long format,
# color encodes the series (the parallel series[] of the original ApexCharts is one and the same table in GoG).
# The last two frames op:append data rows into the spec's data array (append semantics = push onto the target
# array, with the pointer aimed at the array itself); this file takes the row-addressed layout-plane route — writing a layout node
# re-renders the whole row and re-mounts the module host (the chart is rebuilt rather than redrawn in place, see docs/PLAN.md §13),
# so the correct landing place for streaming content is the data slot: the wrapper's update leg = same instance options + render.
# This file is kept in order to cover the "row-addressed patch into spec" protocol path.
- action: append
  slot: chat
  data:
    type: canvas
    url: /assets/g2chart/index.js
    id: stream-chart
    attrs:
      class:
      - flex
    source:
      default:
        type: line
        data:
        - {day: Dec 01, value: 44, team: TEAM A}
        - {day: Dec 02, value: 55, team: TEAM A}
        - {day: Dec 03, value: 31, team: TEAM A}
        - {day: Dec 04, value: 47, team: TEAM A}
        - {day: Dec 05, value: 31, team: TEAM A}
        - {day: Dec 06, value: 43, team: TEAM A}
        - {day: Dec 07, value: 26, team: TEAM A}
        - {day: Dec 08, value: 41, team: TEAM A}
        - {day: Dec 09, value: 31, team: TEAM A}
        - {day: Dec 10, value: 47, team: TEAM A}
        - {day: Dec 11, value: 33, team: TEAM A}
        - {day: Dec 01, value: 55, team: TEAM B}
        - {day: Dec 02, value: 69, team: TEAM B}
        - {day: Dec 03, value: 45, team: TEAM B}
        - {day: Dec 04, value: 61, team: TEAM B}
        - {day: Dec 05, value: 43, team: TEAM B}
        - {day: Dec 06, value: 54, team: TEAM B}
        - {day: Dec 07, value: 37, team: TEAM B}
        - {day: Dec 08, value: 52, team: TEAM B}
        - {day: Dec 09, value: 44, team: TEAM B}
        - {day: Dec 10, value: 61, team: TEAM B}
        - {day: Dec 11, value: 43, team: TEAM B}
        encode:
          x: day
          y: value
          color: team
        style:
          lineWidth: 2
        interaction:
          tooltip: {shared: true}
- action: patch
  slot: chat
  id: stream-chart
  # op:append on an array = push onto the tail (ADR 0005's streaming accumulation semantics):
  # each team adds a 12th day, simulating live point appends.
  path: /bind/value/default/data
  op: append
  value: {day: Dec 12, value: 49, team: TEAM A}
- action: patch
  slot: chat
  id: stream-chart
  path: /bind/value/default/data
  op: append
  value: {day: Dec 12, value: 58, team: TEAM B}
