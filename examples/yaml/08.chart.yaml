# G2 多系列 + 流式追点（ADR 0009 + ADR 0005）：11 天 × 两队长格式数据，
# color encode 分系列（原 ApexCharts 的平行 series[] 在 GoG 里是同一张表）。
# 后两帧 op:append 数据行进 spec 的 data 数组（append 语义 = push 目标
# 数组，指针指向数组本身）；本文件走的是按行寻址的布局平面路线——写布局节点
# 会重渲染整行、重挂模块宿主（图重建而不是就地重绘，见 docs/PLAN.md §13），
# 流式内容的正确落点是数据槽：封装的 update 腿 = 同实例 options + render。
# 保留本文件是为了覆盖"按行寻址 patch 进 spec"这条协议路径。
- action: append
  event: chat
  data:
    type: chart
    id: stream-chart
    attrs:
      class:
      - f
    bind:
      value:
        kind: default
        default:
          type: line
          data:
          - {day: Dec 01, value: 44, team: TEAM A}
          - {day: Dec 02, value: 55, team: TEAM A}
          - {day: Dec 03, value: 31, team: TEAM A}
          - {day: Dec 04, value: 47, team: TEAM A}
          - {day: Dec 05, value: 31, team: TEAM A}
          - {day: Dec 06, value: 43, team: TEAM A}
          - {day: Dec 07, value: 26, team: TEAM A}
          - {day: Dec 08, value: 41, team: TEAM A}
          - {day: Dec 09, value: 31, team: TEAM A}
          - {day: Dec 10, value: 47, team: TEAM A}
          - {day: Dec 11, value: 33, team: TEAM A}
          - {day: Dec 01, value: 55, team: TEAM B}
          - {day: Dec 02, value: 69, team: TEAM B}
          - {day: Dec 03, value: 45, team: TEAM B}
          - {day: Dec 04, value: 61, team: TEAM B}
          - {day: Dec 05, value: 43, team: TEAM B}
          - {day: Dec 06, value: 54, team: TEAM B}
          - {day: Dec 07, value: 37, team: TEAM B}
          - {day: Dec 08, value: 52, team: TEAM B}
          - {day: Dec 09, value: 44, team: TEAM B}
          - {day: Dec 10, value: 61, team: TEAM B}
          - {day: Dec 11, value: 43, team: TEAM B}
          encode:
            x: day
            y: value
            color: team
          style:
            lineWidth: 2
          interaction:
            tooltip: {shared: true}
- action: patch
  event: chat
  id: stream-chart
  # op:append 在数组上 = 尾部 push（ADR 0005 的流式累加语义）：
  # 两队各补第 12 天，模拟实时追点。
  path: /bind/value/default/data
  op: append
  value: {day: Dec 12, value: 49, team: TEAM A}
- action: patch
  event: chat
  id: stream-chart
  path: /bind/value/default/data
  op: append
  value: {day: Dec 12, value: 58, team: TEAM B}
