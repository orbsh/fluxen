# Canvas example (ADR 0007): several 3dbrowser instances + streaming payloads. Only two mesh models are kept — the shoe
# (MaterialsVariantsShoe) and the car (ToyCar); the watch/helmet/sofa no longer ship with the example, fetch them from
# the addresses in assets/modules/3dbrowser/README.md when you need them. Both of these rely on glTF node
# rotation assemblies (ToyCar has one each on its ToyCar/Fabric/Glass parts), so they also serve as
# regression samples for "normalisation must compose with node transforms, not overwrite them" (see the comments in the module's src/lib.rs).
# Prerequisites: the module artifacts are in crates/ui_leptos/assets/3dbrowser/ (recipe in the
# header comment of assets/modules/3dbrowser/Cargo.toml; stage serve brings its own static serving);
# the layout side sends 00.main.yaml first (this file appends two rows to the chat rack).
#
# One separate message per model: each canvas is its own frame appended to chat, stacked
# vertically in the chat stream. The two messages each hang on their own data slot (m3d_shoe / m3d_car) — data slots are single-valued,
# and when several canvases subscribe to the same slot the set written later overwrites the earlier one, so multiple instances must each hang on their own
# slot, one set per slot, so nothing is overwritten.
#
# All assets are CC0 (Khronos glTF-Sample-Assets); download addresses are in
# assets/modules/3dbrowser/README.md.
- action: append
  slot: chat
  data:
    type: canvas
    url: /assets/3dbrowser/index.js
    attrs:
      width: 300px
      height: 260px
    source: {slot: m3d_shoe}
- action: append
  slot: chat
  data:
    type: canvas
    url: /assets/3dbrowser/index.js
    attrs:
      width: 300px
      height: 260px
    source: {slot: m3d_car}
- action: set
  slot: m3d_shoe
  data:
    type: frame
    source:
      default:
        assets:
          shoe: /assets/3dbrowser/MaterialsVariantsShoe.glb
- action: set
  slot: m3d_car
  data:
    type: frame
    source:
      default:
        assets:
          car: /assets/3dbrowser/ToyCar.glb
