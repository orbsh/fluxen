# Canvas 示例（ADR 0007）：3dbrowser 多实例 + 流式喂载荷。只留两件网格模型——鞋
# （MaterialsVariantsShoe）与车（ToyCar）；手表/头盔/沙发不再随示例分发，需要时按
# crates/ui_leptos/assets/3dbrowser/README.md 的地址自行取。这两件都靠 glTF 节点
# 旋转装配（ToyCar 的 ToyCar/Fabric/Glass 三个部件各带一个），所以它们同时是
# "归一化必须与节点变换复合、不能覆盖"的回归样本（见模块 src/lib.rs 的注释）。
# 前置：模块产物在 crates/ui_leptos/assets/3dbrowser/（配方见
# examples/modules/3dbrowser/Cargo.toml 头注释；stage serve 自带静态服务）；
# 布局侧先发 00.main.yaml + 00.chat.yaml（本文件往 chat rack 追加两行）。
#
# 每个模型一条独立消息：每个 canvas 自成一帧 append 进 chat，聊天流里
# 竖排。两条消息各挂各的数据槽（m3d_shoe / m3d_car）——数据槽是单值的，
# 同一槽被多个 canvas 订阅时后写的 set 覆盖先写的，所以多实例必须各挂各的
# 槽，每槽 set 一次，互不覆盖。
#
# 素材均为 CC0（Khronos glTF-Sample-Assets），下载地址见
# crates/ui_leptos/assets/3dbrowser/README.md。
- action: append
  event: chat
  data:
    type: canvas
    url: /assets/3dbrowser/index.js
    attrs:
      width: 300px
      height: 260px
    bind:
      value:
        kind: source
        source: m3d_shoe
- action: append
  event: chat
  data:
    type: canvas
    url: /assets/3dbrowser/index.js
    attrs:
      width: 300px
      height: 260px
    bind:
      value:
        kind: source
        source: m3d_car
- action: set
  event: m3d_shoe
  data:
    type: group
    bind:
      value:
        kind: default
        default:
          assets:
            shoe: /assets/3dbrowser/MaterialsVariantsShoe.glb
- action: set
  event: m3d_car
  data:
    type: group
    bind:
      value:
        kind: default
        default:
          assets:
            car: /assets/3dbrowser/ToyCar.glb