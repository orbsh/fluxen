# Canvas 示例（ADR 0007）：3dbrowser 多实例 + 流式喂载荷。
# 前置：模块产物在 crates/ui_leptos/assets/3dbrowser/（配方见
# examples/modules/3dbrowser/Cargo.toml 头注释；stage serve 自带静态服务）；
# 布局侧先发 00.main.yaml + 00.chat.yaml（本文件往 chat rack 追加若干行）。
#
# 每个模型一条独立消息：每个 canvas 自成一帧 append 进 chat，聊天流里
# 竖排。五条消息各挂各的数据槽（m3d_car / m3d_helmet / ...）——数据槽是
# 单值的，同一槽被多个 canvas 订阅时后写的 set 覆盖先写的，所以多实例
# 必须各挂各的槽，每槽 set 一次，互不覆盖。
#
# 素材均为 CC0（Khronos glTF-Sample-Assets），下载地址见
# crates/ui_leptos/assets/3dbrowser/README.md。
- action: append
  event: chat
  data:
    type: canvas
    url: /assets/3dbrowser/index.js
    attrs:
      width: 300px
      height: 260px
    bind:
      value:
        kind: source
        source: m3d_car
- action: append
  event: chat
  data:
    type: canvas
    url: /assets/3dbrowser/index.js
    attrs:
      width: 300px
      height: 260px
    bind:
      value:
        kind: source
        source: m3d_helmet
- action: append
  event: chat
  data:
    type: canvas
    url: /assets/3dbrowser/index.js
    attrs:
      width: 300px
      height: 260px
    bind:
      value:
        kind: source
        source: m3d_sofa
- action: append
  event: chat
  data:
    type: canvas
    url: /assets/3dbrowser/index.js
    attrs:
      width: 300px
      height: 260px
    bind:
      value:
        kind: source
        source: m3d_shoe
- action: append
  event: chat
  data:
    type: canvas
    url: /assets/3dbrowser/index.js
    attrs:
      width: 300px
      height: 260px
    bind:
      value:
        kind: source
        source: m3d_watch
- action: set
  event: m3d_car
  data:
    type: group
    bind:
      value:
        kind: default
        default:
          assets:
            car: /assets/3dbrowser/ToyCar.glb
- action: set
  event: m3d_helmet
  data:
    type: group
    bind:
      value:
        kind: default
        default:
          assets:
            helmet: /assets/3dbrowser/DamagedHelmet.glb
- action: set
  event: m3d_sofa
  data:
    type: group
    bind:
      value:
        kind: default
        default:
          assets:
            sofa: /assets/3dbrowser/GlamVelvetSofa.glb
- action: set
  event: m3d_shoe
  data:
    type: group
    bind:
      value:
        kind: default
        default:
          assets:
            shoe: /assets/3dbrowser/MaterialsVariantsShoe.glb
- action: set
  event: m3d_watch
  data:
    type: group
    bind:
      value:
        kind: default
        default:
          assets:
            watch: /assets/3dbrowser/ChronographWatch.glb